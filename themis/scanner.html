<title>THEMIS | QRリーダー</title>
<style>
:root{color-scheme:light;font-family:'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif;background:#c9aa7e;color:#221d19}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#c9aa7e;padding:18px 12px 32px}
main{max-width:510px;min-height:calc(100vh - 50px);margin:auto;padding:25px 24px 34px;background:#f4eddc;border:1px solid #6c5340;box-shadow:5px 7px 0 #7c6048}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:2px solid #211b18;border-bottom:1px solid #211b18;padding:9px 2px 10px}
.brand-logo{display:block;width:190px;max-width:67%;height:auto;object-fit:contain}
.tag{font:11px Georgia,serif;white-space:nowrap}
button#homeNav{width:auto;min-height:40px;min-width:116px;margin:0;padding:8px 11px;border:1px solid #4d3c31;background:#f7f0e2;color:#302521;box-shadow:none;font-size:13px;letter-spacing:0;white-space:nowrap}
h1{text-align:center;font-size:25px;margin:24px 0 15px}p{font-size:14px;line-height:1.8;color:#3d332e}
.status{padding:12px 14px;border-left:4px solid #982c2d;background:#efe2cf;margin:16px 0;line-height:1.7;overflow-wrap:anywhere}
.status.error{background:#fae3de;color:#7b101c;border-color:#a80012}
button{display:block;width:100%;min-height:58px;padding:13px 16px;border:2px solid #28201c;background:#302521;color:#fff7e9;font:800 17px 'Yu Mincho','Hiragino Mincho ProN',serif;cursor:pointer;margin:15px 0 0;border-radius:0}
button.secondary{background:#f7f0e2;color:#302521;border-color:#776355}
#reader{width:100%;min-height:250px;border:2px solid #57483e;background:#eee3ce;margin-top:18px}
#reader video{max-width:100%;object-fit:cover}
.tiny{font:12px/1.7 system-ui,sans-serif;color:#65594e}
#result{overflow-wrap:anywhere;border:3px solid #982c2d;background:#f3e7d2;padding:21px 17px;margin:18px 0 22px;text-align:center;box-shadow:4px 4px 0 #b7a18a}
#result strong{display:block;font-size:27px;color:#982c2d;margin:0 0 12px;letter-spacing:.05em}
#result #decoded{font-weight:800;font-size:20px}
.hidden{display:none!important}
#decoded{font:14px system-ui,sans-serif;color:#982c2d}
#overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(21,11,10,.82)}
#overlay.hidden{display:none!important}
.dialog{width:min(100%,460px);max-height:92dvh;overflow-y:auto;background:#f4eddc;padding:24px 20px;border:3px solid #982c2d;box-shadow:6px 6px 0 #302521}
.dialog h2{color:#982c2d;font-size:24px;text-align:center;margin:5px 0 16px}
.dialog .label{font:800 13px system-ui,sans-serif;color:#982c2d;text-align:center;letter-spacing:.12em}
#cause{font-weight:800;color:#651c1f;border-left:4px solid #982c2d;background:#fae3de;padding:12px;line-height:1.6}
#detail{line-height:1.8}
@media(max-width:390px){body{padding:8px 7px 20px}main{padding:18px 16px 25px;min-height:calc(100vh - 26px)}.brand-logo{width:155px}}
</style>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>

<h1>問題のQRコードを読み取る</h1>
<p>カメラをQRコードに向けると、自動で読み取ります。写真を撮る必要はありません。</p>
<section id="result" class="hidden">
<strong>読み取り完了</strong><p id="decoded"></p>
<p>ホームで使用確認に進みます。QRを読み取っただけでは使用回数は減りません。</p>
<button id="back" type="button">ヒントを表示</button>
<p class="tiny">自動で切り替わらない場合はブラウザのタブ一覧から「ホーム」を選んでください。</p>
<button id="copy" class="secondary" type="button">問題コードをコピー</button>
</section>
<div id="status" class="status" role="status" aria-live="polite">カメラを準備しています…</div>
<div id="reader"></div>
<button id="retry" class="secondary hidden" type="button">もう一度読み取る</button>
<p class="tiny">ブラウザからカメラの許可を求められたら「許可」を選んでください。カメラ映像は保存しません。</p>
</main>
<div id="overlay" class="hidden" role="alertdialog" aria-modal="true" aria-labelledby="title" aria-describedby="cause detail" tabindex="-1">
<div class="dialog"><p class="label">CONNECTION ERROR / 接続エラー</p>
<h2 id="title">ホームに接続できません</h2>
<div id="cause"></div><p id="detail"></p>
<p class="tiny">QRコードの読み取りは成功しています。ヒントはまだ使用していません。</p>
<button id="errorCopy">問題コードをコピー</button><button class="secondary" id="errorClose">エラーを閉じる</button></div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
let reader=null,busy=false,scanned=false,lastValue='';
function status(text,isError=false){$('status').textContent=text;$('status').className='status'+(isError?' error':'');}
function errorModal(cause,detail){$('cause').textContent=cause;$('detail').textContent=detail;$('errorCopy').disabled=!lastValue;$('overlay').classList.remove('hidden');$('overlay').focus();}
function closeModal(){$('overlay').classList.add('hidden');}
async function stop(){if(!reader)return;let old=reader;reader=null;try{if(old.isScanning)await old.stop();}catch(e){}try{old.clear();}catch(e){}}
// GASのホームへ戻るURLはURLフラグメントにだけ保持（公開ページへのHTTP要求に含まれない）。
function getHomeUrl(){
 try{
  const raw=new URLSearchParams(location.hash.slice(1)).get('return');
  if(!raw)return null;
  const url=new URL(raw);
  if(url.protocol!=='https:'||url.hostname!=='script.google.com'||
     !/^\/macros\/s\/[^/]+\/exec$/.test(url.pathname)||
     !/^(?:[A-H]-[1-6]|I-[1-3])$/.test(url.searchParams.get('team')||'')||
     !/^[a-f0-9]{64}$/i.test(url.searchParams.get('key')||''))return null;
  return url;
 }catch(e){return null;}
}
function navigateHome(withQuestion){
 const home=getHomeUrl();
 if(!home)return false;
 if(withQuestion && lastValue)home.searchParams.set('question',lastValue);
 else home.searchParams.delete('question');
 // openerに依存せず、同じタブでホームへ戻す。
 window.location.assign(home.href);
 return true;
}
function sendToHome(){
 if(!window.opener){errorModal('原因：ホームとのタブ接続がありません。','このブラウザはQRリーダーを開くとき、ホームとの接続情報（window.opener）を引き継いでいません。Google Apps Scriptの埋め込み表示・ブラウザのタブ保護設定などが考えられます。ブラウザのタブ一覧からホームに戻ってください。');return false;}
 try{if(window.opener.closed){errorModal('原因：ホームのタブが閉じています。','QRコードを送信する先がありません。班専用ログインQRからホームを開き直してください。');return false;}}
 catch(e){errorModal('原因：ホームのタブ状態を確認できません。','ブラウザがタブ間のアクセスを制限しています。詳細：'+String(e));return false;}
 try{window.opener.postMessage({type:'THEMIS_QR_SCANNED',value:lastValue},'*');return true;}
 catch(e){errorModal('原因：ホームへのメッセージ送信に失敗しました。','ブラウザのタブ間通信が失敗しました。詳細：'+String(e));return false;}
}
async function start(){
 if(busy)return;busy=true;scanned=false;lastValue='';closeModal();$('reader').classList.remove('hidden');$('status').classList.remove('hidden');$('retry').classList.add('hidden');$('result').classList.add('hidden');$('decoded').textContent='';status('カメラを起動しています…');
 try{
 if(typeof Html5Qrcode==='undefined')throw Error('QR読み取りライブラリを読み込めませんでした。');
 await stop();reader=new Html5Qrcode('reader',{verbose:false});
 await reader.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>{const side=Math.max(150,Math.min(260,Math.floor(Math.min(w,h)*.78)));return {width:side,height:side};}},async value=>{
  if(scanned)return;
  const match=/^(?:THEMIS:)?Q(0[1-9]|1[0-5])$/i.exec(String(value).trim());
  if(!match){status('THEMISの問題用QRコードではありません。別のQRを映してください。',true);return;}
  scanned=true;lastValue='THEMIS:Q'+match[1];await stop();
  $('reader').classList.add('hidden');$('status').classList.add('hidden');
  $('retry').classList.remove('hidden');$('result').classList.remove('hidden');$('decoded').textContent='読み取った問題：'+lastValue;
  window.scrollTo({top:0,behavior:'smooth'});
  // スキャン成功で自動遷移せず、ユーザーが「ヒントを表示」を押すまで完了画面を見せる。
  if(!getHomeUrl() && !window.opener){status('ホームとの接続情報がありません。班専用QRからホームを開いてスキャンしてください。',true);}
 },()=>{});
 if(!scanned)status('カメラを問題用QRコードに向けてください。');
 }catch(e){status('カメラを起動できませんでした。',true);errorModal('原因：カメラを開始できません。','カメラの権限、他アプリで使用中でないこと、HTTPS接続を確認してください。詳細：'+(e?.message||String(e)));$('retry').classList.remove('hidden');}
 finally{busy=false;}
}
$('homeNav').addEventListener('click',()=>{
 if(navigateHome(false))return;
 // 元ページに接続できる場合はそのタブを前面へ。
 if(window.opener){
  try{
   if(!window.opener.closed){
    window.opener.focus();
    status('ホームを開きました。画面が切り替わらない場合はブラウザのタブ一覧からホームを選んでください。');
    return;
   }
  }catch(e){}
 }
 // opener のない端末で、元のGASページから遷移してきた場合のみ戻る
 try{
  const source=document.referrer?new URL(document.referrer):null;
  if(source && source.protocol==='https:' && source.hostname==='script.google.com' && source.pathname.includes('/macros/')){
   window.location.assign(source.href);
   return;
  }
 }catch(e){}
 errorModal('原因：ホームへの接続情報がありません。','この端末ではQRリーダーを別タブで開くと元のホームとの接続が切れる場合があります。Chromeのタブ一覧（四角い数字のアイコン）から、元のGoogle Apps Scriptのホームを選んでください。');
});
$('retry').addEventListener('click',start);
$('back').addEventListener('click',()=>{
 if(navigateHome(true))return;
 if(window.opener && sendToHome()){
  try{window.opener.focus();}catch(e){}
  status('ホームに送信しました。画面が切り替わらない場合はタブ一覧からホームを選んでください。');
  return;
 }
 if(!window.opener)errorModal('原因：ホームへの戻り先がありません。','ホームのQRスキャンボタンから起動してください。GitHubのQRリーダーだけを直接開いても、班のログイン先が分からないためヒントを表示できません。');
});
